<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Suporte Folha de Pagamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* Estilo dos botões */
    .sidebar-nav ul li a {
      display: block !important;
      background-color: #ffffff !important;
      color: #374151 !important;
      padding: 12px 18px !important;
      margin-bottom: 8px !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      border: 1px solid #e5e7eb !important;
      transition: all 0.2s ease;
    }

    .sidebar-nav ul li.active > a {
      background-color: #e65124 !important;
      color: #ffffff !important;
      border-color: #e65124 !important;
    }

    /* Força os submenus a ficarem escondidos até o clique */
    .sidebar-nav ul li ul {
      display: none !important;
    }

    /* Mostra o submenu apenas quando tem a classe 'open' (adicionada pelo plugin) */
    .sidebar-nav ul li.open > ul {
      display: block !important;
      padding-left: 15px !important;
    }

    .sidebar-nav ul ul li a {
      background-color: #f9fafb !important;
      font-size: 0.9em !important;
    }
  </style>
</head>
<body>
  <div id="app">Carregando...</div>
  
  <script>
    window.$docsify = {
      name: 'Suporte Folha',
      loadSidebar: true,
      subMaxLevel: 3,
      // Esta opção evita que o menu feche sozinho ao navegar
      sidebarDisplayLevel: 0 
    }
  </script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
