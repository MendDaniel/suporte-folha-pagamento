<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Suporte Folha de Pagamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* Estilo base dos botões */
    .sidebar-nav ul li a {
      display: block !important;
      background-color: #ffffff !important;
      color: #374151 !important;
      padding: 12px 18px !important;
      margin-bottom: 8px !important;
      border-radius: 6px !important;
      border: 1px solid #e5e7eb !important;
      text-decoration: none !important;
    }

    /* Estilo de seleção ativa */
    .sidebar-nav ul li.active > a {
      background-color: #e65124 !important;
      color: #ffffff !important;
      border-color: #e65124 !important;
    }

    /* Esconde submenus por padrão */
    .sidebar-nav ul li ul {
      display: none !important;
    }

    /* Mostra submenu quando o pai tem a classe 'open' */
    .sidebar-nav ul li.open > ul {
      display: block !important;
      padding-left: 15px !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script>
    window.$docsify = {
      name: 'Suporte Folha',
      loadSidebar: true,
      subMaxLevel: 2,
      // Garante que o menu mantenha o estado de aberto ao navegar
      sidebarDisplayLevel: 1 
    }
  <script>
    window.$docsify = {
      name: 'Suporte Folha',
      loadSidebar: true,
      subMaxLevel: 3,
      // Configurações do plugin sidebar-collapse
      sidebarDisplayLevel: 0, // 0 = tudo fechado inicialmente
      autoCollapse: true     // Fecha os outros menus ao abrir um novo
    }
  </script>
</body>
</html>
