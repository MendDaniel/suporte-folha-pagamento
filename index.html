<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Suporte Folha de Pagamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* CONFIGURAÇÃO DA IMAGEM DE FUNDO FIXA E SUAVE NO SITE INTEIRO */
    body {
      background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('ResultaUmuarama') !important;
      background-attachment: fixed !important; /* Mantém o fundo preso ao rolar a página */
      background-size: cover !important;       /* Estica a foto para cobrir toda a tela */
      background-position: center !important;   /* Centraliza a imagem */
    }

    /* Ajuste para o fundo da barra lateral acompanhar a suavidade */
    .sidebar {
      background-color: rgba(28, 28, 28, 0.95) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.1) !important;
    }

    /* SEU CÓDIGO ANTERIOR DOS BOTÕES GRANDES */
    .sidebar-nav ul li a {
      display: block !important;
      background-color: #1a1a1a !important;
      color: #e5e7eb !important;
      padding: 14px 20px !important;
      margin-bottom: 10px !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      text-decoration: none !important;
      border: 1px solid #374151 !important;
      transition: all 0.2s ease;
    }
    .sidebar-nav ul li:first-child a {
      background-color: #e65124 !important;
      color: white !important;
      border-color: #c2410c !important;
    }
    .sidebar-nav ul li a:hover, .sidebar-nav ul li.active > a {
      filter: brightness(1.2);
    }
  </style>
</head>
<body>
  <div id="app">Carregando documentação...</div>
  <script>
    window.$docsify = {
      name: 'Suporte Folha',
      loadSidebar: true,
      subMaxLevel: 2
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
