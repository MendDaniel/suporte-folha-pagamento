<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Suporte Folha de Pagamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- CÓDIGO QUE CRIA OS BOTÕES GRANDES NA ESQUERDA -->
  <style>
    .sidebar-nav ul li a {
      display: block !important;
      background-color: #f3f4f6 !important; /* Cor de fundo cinza claro */
      color: #1f2937 !important;            /* Cor do texto escura */
      padding: 14px 20px !important;        /* Deixa o botão alto e largo */
      margin-bottom: 10px !important;       /* Espaço entre um botão e outro */
      border-radius: 8px !important;        /* Bordas arredondadas nos cantos */
      font-weight: bold !important;         /* Texto em negrito */
      text-decoration: none !important;
      border: 1px solid #e5e7eb !important; /* Linha fina ao redor do botão */
      transition: all 0.2s ease;
    }
    /* Efeito quando passa o mouse ou clica no botão */
    .sidebar-nav ul li a:hover, .sidebar-nav ul li.active > a {
      background-color: #3b82f6 !important; /* Muda o fundo para Azul */
      color: white !important;              /* Muda o texto para Branco */
      border-color: #2563eb !important;
    }
  </style>
</head>
<body>
  <div id="app">Carregando documentação...</div>
  <script>
    window.$docsify = {
      name: 'Suporte Folha',
      loadSidebar: true,
      subMaxLevel: 2
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
