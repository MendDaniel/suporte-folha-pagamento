<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Suporte Folha de Pagamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* FORÇA TODAS AS LETRAS GERAIS DO SITE A FICAREM BRANCAS */
    body, .markdown-section, p, span, h1, h2, h3, h4, li {
      color: #ffffff !important;
    }

    /* CONFIGURAÇÃO DA IMAGEM DE FUNDO FIXA E SUAVE NO SITE INTEIRO */
    body {
      background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('ResultaUmuarama.png') !important;
      background-attachment: fixed !important; /* Mantém o fundo preso ao rolar a página */
      background-size: cover !important;       /* Estica a foto para cobrir toda a tela */
      background-position: center !important;   /* Centraliza a imagem */
    }

    /* FAZ A BARRA LATERAL FICAR 100% TRANSPARENTE PARA MOSTRAR O FUNDO DO CENTRO */
    .sidebar {
      background-color: transparent !important; /* Remove o fundo preto da barra */
      border-right: none !important;            /* Remove a linha vertical divisória */
    }

    /* TÍTULO DO SITE NA BARRA LATERAL */
    .sidebar .app-name-link {
      color: #ffffff !important;
      font-weight: bold !important;
    }

    /* CONFIGURAÇÃO DOS BOTÕES GRANDES E LEVEMENTE RESSALTADOS */
    .sidebar-nav ul li a {
      display: block !important;
      background-color: rgba(26, 26, 26, 0.7) !important; /* Fundo semi-transparente para o botão flutuar */
      color: #e5e7eb !important;            /* Texto claro */
      padding: 14px 20px !important;        /* Tamanho grande */
      margin-bottom: 10px !important;       /* Espaço entre eles */
      border-radius: 8px !important;        /* Cantos arredondados */
      font-weight: bold !important;         /* Negrito */
      text-decoration: none !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important; /* Borda bem sutil para dar o relevo */
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3) !important;     /* Sombra leve para ressaltar o botão */
      transition: all 0.2s ease;
    }

    /* CONFIGURAÇÃO DO PRIMEIRO BOTÃO (LARANJA RESULTA) */
    .sidebar-nav ul li:first-child a {
      background-color: #e65124 !important; /* Fundo Laranja */
      color: white !important;              /* Texto Branco */
      border-color: #c2410c !important;
    }

    /* EFEITO QUANDO PASSA O MOUSE NOS OUTROS BOTÕES */
    .sidebar-nav ul li a:hover, .sidebar-nav ul li.active > a {
      filter: brightness(1.3);
      background-color: rgba(26, 26, 26, 0.9) !important; /* Escurece ligeiramente ao focar */
    }
  </style>
</head>
<body>
  <div id="app">Carregando documentação...</div>
  <script>
    window.$docsify = {
      name: 'Suporte Folha',
      loadSidebar: true,
      subMaxLevel: 2
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
