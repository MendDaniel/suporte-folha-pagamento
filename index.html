<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Suporte Folha de Pagamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* Estilo para os botões expansíveis (accordion) */
    details {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #f9fafb;
    }
    summary {
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }
    details[open] summary {
      color: #e65124;
      margin-bottom: 10px;
    }

    /* Seus estilos de sidebar existentes */
    .sidebar-nav ul li a {
      display: block !important;
      background-color: #ffffff !important;
      color: #374151 !important;
      padding: 12px 18px !important;
      margin-bottom: 8px !important;
      border-radius: 6px !important;
      border: 1px solid #e5e7eb !important;
      text-decoration: none !important;
    }
    .sidebar-nav ul li.active > a {
      background-color: #e65124 !important;
      color: #ffffff !important;
      border-color: #e65124 !important;
    }
  </style>
</head>
<body>
  <div id="app">Carregando...</div>
  
  <script>
    window.$docsify = {
      name: 'Suporte Folha',
      loadSidebar: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 0, 
      autoCollapse: true,
      routerMode: 'hash'
    }
  </script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <script>
    document.addEventListener("click", function(e) {
      // Verifica se o link clicado pertence ao domínio do suporte
      if (e.target.tagName === 'A' && e.target.href.includes('suporte.dominioatendimento.com')) {
        const confirmacao = confirm(
          "Você será redirecionado para o Portal de Atendimento.\n\n" +
          "Certifique-se de que já está logado no sistema para acessar esta página de treinamento.\n" +
          "Caso o erro 'Acesso Proibido' apareça, realize o login primeiro e tente novamente."
        );
        
        if (!confirmacao) {
          e.preventDefault();
        }
      }
    });
  </script>
</body>
</html>
