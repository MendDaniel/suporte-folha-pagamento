<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Suporte Folha de Pagamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* FORÇA TODAS AS LETRAS GERAIS DO SITE A FICAREM BRANCAS */
    body, .markdown-section, p, span, h1, h2, h3, h4, li {
      color: #ffffff !important;
    }

    /* CONFIGURAÇÃO DA IMAGEM DE FUNDO FIXA E AINDA MAIS SUAVE (93% ESCURA) */
    body {
      background-image: linear-gradient(rgba(0, 0, 0, 0.93), rgba(0, 0, 0, 0.93)), url('ResultaUmuarama.png') !important;
      background-attachment: fixed !important;
      background-size: cover !important;
      background-position: center !important;
    }

    /* FAZ A BARRA LATERAL FICAR 100% TRANSPARENTE */
    .sidebar {
      background-color: transparent !important;
      border-right: none !important;
    }

    /* TÍTULO DO SITE NA BARRA LATERAL */
    .sidebar .app-name-link {
      color: #ffffff !important;
      font-weight: bold !important;
    }

    /* CONFIGURAÇÃO PADRÃO DOS BOTÕES GRANDES */
    .sidebar-nav ul li a {
      display: block !important;
      background-color: rgba(26, 26, 26, 0.7) !important;
      color: #e5e7eb !important;
      padding: 14px 20px !important;
      margin-bottom: 10px !important;
      border-radius: 8px !important;
      font-weight: bold !important;
      text-decoration: none !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3) !important;
      transition: all 0.2s ease;
    }

    /* REGRA QUE FAZ O BOTÃO SELECIONADO ATUAL FICAR LARANJA AUTOMATICAMENTE */
    .sidebar-nav ul li.active > a {
      background-color: #e65124 !important;
      color: white !important;
      border-color: #c2410c !important;
    }

    /* EFEITO DE BRILHO AO PASSAR O MOUSE */
    .sidebar-nav ul li a:hover {
      filter: brightness(1.3);
      background-color: rgba(26, 26, 26, 0.9) !important;
    }
  </style>
</head>
<body>
  <div id="app">Carregando documentação...</div>
  <script>
    window.$docsify = {
      name: 'Suporte Folha',
      loadSidebar: true,
      subMaxLevel: 2
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
